name: Deploy to DirectAdmin (Production)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Fast Deploy to DirectAdmin
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync Core files to DirectAdmin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /domains/lppm.tsu.ac.id/tsu_lppm_core/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            public/**
            vendor/**
            node_modules/**
            .idea/**
            .vscode/**
            storage/logs/*.log

      - name: Sync Public files to DirectAdmin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/
          server-dir: /domains/lppm.tsu.ac.id/public_html/

      - name: Execute Server Scripts via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: APP_URL,DB_HOST,DB_PORT,DB_DATABASE,DB_USERNAME,DB_PASSWORD
          script: |
            set -e

            # 1. Sesuaikan path index.php di public_html agar mengarah ke lppm_core
            cd ~/domains/lppm.tsu.ac.id/public_html
            sed -i "s|__DIR__.'/../storage/|__DIR__.'/../lppm_core/storage/|g" index.php
            sed -i "s|__DIR__.'/../vendor/|__DIR__.'/../lppm_core/vendor/|g" index.php
            sed -i "s|__DIR__.'/../bootstrap/|__DIR__.'/../lppm_core/bootstrap/|g" index.php

            # 2. Setup core aplikasi
            cd ~/domains/lppm.tsu.ac.id/lppm_core

            mkdir -p storage/framework/{sessions,views,cache} bootstrap/cache
            # Memastikan hak akses folder cache dan log aman SETELAH semua file tergenerate
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            chmod 600 storage/*.key 2>/dev/null || true
            
            if [ ! -f .env ]; then cp .env.example .env; fi
            touch database/database.sqlite

            # Bersihkan variabel Secrets dari karakter spasi/enter tersembunyi (CR/LF)
            APP_URL=$(echo "$APP_URL" | tr -d '\r\n ')
            DB_HOST=$(echo "$DB_HOST" | tr -d '\r\n ')
            DB_PORT=$(echo "$DB_PORT" | tr -d '\r\n ')
            DB_DATABASE=$(echo "$DB_DATABASE" | tr -d '\r\n ')
            DB_USERNAME=$(echo "$DB_USERNAME" | tr -d '\r\n ')
            DB_PASSWORD=$(echo "$DB_PASSWORD" | tr -d '\r\n') # Jangan hapus spasi pada password

            # Fungsi aman untuk update .env dengan tanda petik
            update_env() {
                local key=$1
                local val=$2
                if [ -n "$val" ]; then
                    # Escape tanda petik ganda di dalam value
                    local escaped_val=$(echo "$val" | sed 's/"/\\"/g')
                    # Hapus baris lama
                    sed -i "/^${key}=/d" .env
                    # Tambahkan baris baru dengan quote
                    echo "${key}=\"${escaped_val}\"" >> .env
                fi
            }

            # Set Config otomatis via Secrets
            update_env "APP_URL" "$APP_URL"
            update_env "DB_HOST" "$DB_HOST"
            update_env "DB_PORT" "$DB_PORT"
            update_env "DB_DATABASE" "$DB_DATABASE"
            update_env "DB_USERNAME" "$DB_USERNAME"
            update_env "DB_PASSWORD" "$DB_PASSWORD"

            # Generate APP_KEY jika masih kosong
            if grep -q "^APP_KEY=$" .env; then
                php artisan key:generate --force
            fi

            # 3. Membuat symlink storage/app/public ke public_html/storage jika belum ada
            ln -sfn $(pwd)/storage/app/public ../public_html/storage

            # 4. Install dependencies & optimasi
            wget -O composer.phar https://getcomposer.org/download/latest-stable/composer.phar
            export COMPOSER_ALLOW_SUPERUSER=1
            php composer.phar install --ignore-platform-reqs --no-dev --optimize-autoloader

            php artisan optimize:clear
            php artisan optimize
            php artisan view:cache
            php artisan migrate --force
